<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WhatsApp Atendente & Agendamento IA</title>
  
  <!-- Fontes Google & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      /* TEMA WHATSAPP WEB CLARO */
      --wa-green: #00a884;
      --wa-green-light: #25D366;
      --wa-green-hover: #06cf9c;
      --wa-green-dark: #008069;
      --wa-light-bg: #f0f2f5;
      --wa-card-bg: #ffffff;
      --wa-card-border: #e9edef;
      --wa-text-main: #111b21;
      --wa-text-muted: #667781;
      --wa-text-sub: #54656f;
      --wa-pill-active: #d9fdd3;
      --wa-pill-active-text: #008069;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--wa-light-bg);
      color: var(--wa-text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 168, 132, 0.08) 0%, transparent 60%);
    }

    .login-card {
      background: var(--wa-card-bg);
      border: 1px solid var(--wa-card-border);
      border-radius: var(--radius-lg);
      width: 440px;
      max-width: 100%;
      padding: 40px 36px;
      box-shadow: 0 10px 30px rgba(11, 20, 26, 0.08);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, var(--wa-green-light), var(--wa-green-dark));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      margin: 0 auto 16px auto;
      box-shadow: 0 6px 18px rgba(0, 168, 132, 0.3);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--wa-text-main);
      letter-spacing: -0.5px;
    }

    .brand-tag {
      display: inline-block;
      background: var(--wa-pill-active);
      color: var(--wa-pill-active-text);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: var(--wa-text-muted);
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--wa-text-main);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--wa-card-border);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      color: var(--wa-text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--wa-green);
      box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.15);
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .btn-login {
      width: 100%;
      background: var(--wa-green);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(0, 168, 132, 0.3);
    }

    .btn-login:hover {
      background: var(--wa-green-dark);
      transform: translateY(-1px);
    }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .register-link-box {
      text-align: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--wa-card-border);
    }

    .register-link-box span {
      font-size: 13px;
      color: var(--wa-text-muted);
    }

    .register-link-box a {
      color: var(--wa-green-dark);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      transition: color 0.2s ease;
    }

    .register-link-box a:hover {
      color: var(--wa-green);
    }

    .demo-credentials {
      margin-top: 24px;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid var(--wa-card-border);
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--wa-text-sub);
      line-height: 1.6;
    }

    .demo-credentials strong {
      color: var(--wa-text-main);
      display: block;
      margin-bottom: 6px;
      font-size: 12.5px;
    }

    .demo-credentials code {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--wa-green-dark);
      font-weight: 600;
      font-family: 'Inter', monospace;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon"><i class="fa-brands fa-whatsapp"></i></div>
      <h1 class="brand-title">WhatsApp Atendente</h1>
      <div><span class="brand-tag">Painel de Atendimento</span></div>
      <p class="brand-subtitle">Acesse o painel do seu estabelecimento</p>
    </div>

    <div class="alert-success" id="login-success"><i class="fa-solid fa-circle-check"></i> <span id="login-success-text"></span></div>
    <div class="alert-error" id="login-alert"><i class="fa-solid fa-circle-exclamation"></i> <span id="login-alert-text"></span></div>

    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label>Email de Acesso</label>
        <input type="email" id="login-email" class="form-control" placeholder="seu@email.com.br" required autocomplete="email">
      </div>

      <div class="form-group" style="margin-bottom: 8px;">
        <label>Senha de Acesso</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 18px;">
        <a href="/reset-password" style="font-size: 12.5px; color: var(--wa-green-dark); text-decoration: none; font-weight: 600;">
          Esqueceu a senha?
        </a>
      </div>

      <button type="submit" class="btn-login" id="btn-login-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel
      </button>
    </form>

    <div class="register-link-box">
      <span>Ainda não tem uma conta?</span><br>
      <a href="/register">
        <i class="fa-solid fa-bolt"></i> Ver Planos & Cadastre-se Grátis
      </a>
    </div>

    <!-- Contas de Demonstração / Testes (Apenas quando solicitado ou parâmetro ?demo) -->
    <details class="demo-credentials" id="demo-credentials-box" style="margin-top: 20px; cursor: pointer;">
      <summary style="font-weight: 600; color: var(--wa-text-sub); outline: none; list-style: none; display: flex; align-items: center; justify-content: space-between; user-select: none;">
        <span><i class="fa-solid fa-flask" style="color: var(--wa-green); margin-right: 6px;"></i> Contas de Demonstração</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 11px;"></i>
      </summary>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <button type="button" onclick="fillAndLogin('iran.s.araujo@gmail.com', '123456')" style="text-align: left; padding: 8px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center;">
          <span>👤 <strong>Iran Araújo (Admin)</strong><br><small style="color: #64748b;">iran.s.araujo@gmail.com</small></span>
          <span style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px;">Entrar ➔</span>
        </button>
        <button type="button" onclick="fillAndLogin('dono@estilobeleza.com.br', '123456')" style="text-align: left; padding: 8px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center;">
          <span>💼 <strong>Carlos Dono (Empresa A)</strong><br><small style="color: #64748b;">dono@estilobeleza.com.br</small></span>
          <span style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px;">Entrar ➔</span>
        </button>
        <button type="button" onclick="fillAndLogin('contato@clinicasaude.com.br', '123456')" style="text-align: left; padding: 8px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center;">
          <span>🏥 <strong>Dra. Ana Saúde (Empresa B)</strong><br><small style="color: #64748b;">contato@clinicasaude.com.br</small></span>
          <span style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px;">Entrar ➔</span>
        </button>
      </div>
    </details>
  </div>

  <script>
    const baseUrl = window.location.protocol.startsWith('http') ? '' : 'http://localhost:3001';

    async function handleLoginSubmit(e) {
      if (e && e.preventDefault) e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const alertBox = document.getElementById('login-alert');
      const alertText = document.getElementById('login-alert-text');
      const successBox = document.getElementById('login-success');
      const btn = document.getElementById('btn-login-submit');

      alertBox.style.display = 'none';
      if (successBox) successBox.style.display = 'none';
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

      try {
        const response = await fetch(`${baseUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('saas_token', data.token);
          localStorage.setItem('saas_user', JSON.stringify(data.user));
          localStorage.setItem('saas_tenant', JSON.stringify(data.tenant));

          btn.innerHTML = '<i class="fa-solid fa-check"></i> Sucesso! Redirecionando...';
          btn.style.background = '#25D366';

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else if (data.requireVerification) {
          // Bloqueio por falta de confirmação de e-mail: redireciona para confirmação OTP
          alertText.textContent = data.error || 'Por favor, confirme seu e-mail antes de fazer login.';
          alertBox.style.display = 'flex';
          btn.innerHTML = '<i class="fa-solid fa-envelope"></i> Redirecionando para verificação...';
          setTimeout(() => {
            window.location.href = `/verify-email?email=${encodeURIComponent(email)}`;
          }, 1200);
        } else {
          alertText.textContent = data.error || 'Credenciais inválidas. Verifique seu e-mail e senha.';
          alertBox.style.display = 'flex';
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel';
        }
      } catch (err) {
        alertText.textContent = 'Erro ao conectar ao servidor. Tente novamente.';
        alertBox.style.display = 'flex';
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel';
      }
    }

    function fillAndLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      handleLoginSubmit(null);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('verified') === 'true') {
        const successBox = document.getElementById('login-success');
        const successText = document.getElementById('login-success-text');
        if (successBox && successText) {
          successText.textContent = 'E-mail confirmado com sucesso! Faça login para acessar.';
          successBox.style.display = 'flex';
        }
      } else if (urlParams.get('reset') === 'true') {
        const successBox = document.getElementById('login-success');
        const successText = document.getElementById('login-success-text');
        if (successBox && successText) {
          successText.textContent = 'Senha redefinida com sucesso! Entre com a nova senha.';
          successBox.style.display = 'flex';
        }
      }

      // Se a URL contiver ?demo=true ou ?demo, expande as credenciais de teste
      if (urlParams.has('demo')) {
        const demoBox = document.getElementById('demo-credentials-box');
        if (demoBox) demoBox.open = true;
      }
    });
  </script>

</body>
</html>
